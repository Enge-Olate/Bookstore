name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: bookstore.settings
      DEBUG: "0"
      SECRET_KEY: "ci-test-secret-key"
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: bookstore
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: localhost
      SQL_PORT: 5432

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bookstore"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Instalar dependências
        run: poetry install --with dev --no-interaction --no-root

      - name: Verificar configuração do Django
        run: poetry run python manage.py check

      - name: Aplicar migrações
        run: poetry run python manage.py migrate --noinput

      
      - name: Validar formatação
        run: poetry run black --check .

      - name: Executar testes
        run: poetry run pytest -q

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build --tag bookstore:${{ github.sha }} .

  deploy:
    name: Deploy PythonAnywhere
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test
      - build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: pythonanywhere-production
      cancel-in-progress: false
    env:
      PA_USERNAME: ${{ vars.PYTHONANYWHERE_USERNAME }}
      PA_PROJECT_PATH: ${{ vars.PYTHONANYWHERE_PROJECT_PATH }}
      PA_VENV_PATH: ${{ vars.PYTHONANYWHERE_VENV_PATH }}
      PA_WSGI_FILE: ${{ vars.PYTHONANYWHERE_WSGI_FILE }}
      PA_SSH_PRIVATE_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
      PA_KNOWN_HOSTS: ${{ secrets.PYTHONANYWHERE_KNOWN_HOSTS }}

    steps:
      - name: Validar configuração de deploy
        run: |
          if [ -z "$PA_USERNAME" ] || [ -z "$PA_PROJECT_PATH" ] || \
             [ -z "$PA_VENV_PATH" ] || [ -z "$PA_WSGI_FILE" ] || \
             [ -z "$PA_SSH_PRIVATE_KEY" ] || [ -z "$PA_KNOWN_HOSTS" ]; then
            echo "::error::Configure todas as variáveis e secrets do PythonAnywhere no GitHub."
            exit 1
          fi

      - name: Configurar acesso SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PA_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PA_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Atualizar aplicação no PythonAnywhere
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          remote_command="$(printf '%q ' bash -s -- "$PA_PROJECT_PATH" "$PA_VENV_PATH" "$PA_WSGI_FILE" "$DEPLOY_BRANCH")"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$PA_USERNAME@ssh.pythonanywhere.com" \
            "$remote_command" <<'REMOTE_SCRIPT'
          set -euo pipefail
          project_path=$1
          venv_path=$2
          wsgi_file=$3
          deploy_branch=$4

          cd "$project_path"
          git pull --ff-only origin "$deploy_branch"
          source "$venv_path/bin/activate"
          python -m pip install --upgrade poetry
          poetry install --only main --no-root --no-interaction
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          touch "$wsgi_file"
          REMOTE_SCRIPT
