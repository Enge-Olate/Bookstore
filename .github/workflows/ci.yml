name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: bookstore.settings
      DEBUG: "0"
      SECRET_KEY: "ci-test-secret-key"
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: bookstore
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: localhost
      SQL_PORT: 5432

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bookstore"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Instalar dependências
        run: poetry install --with dev --no-interaction --no-root

      - name: Verificar configuração do Django
        run: poetry run python manage.py check

      - name: Aplicar migrações
        run: poetry run python manage.py migrate --noinput

      
      - name: Validar formatação
        run: poetry run black --check .

      - name: Executar testes
        run: poetry run pytest -q

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem
        uses: docker build --tag bookstore:${{ github.sha }} .

      
      
